[project]
name = "firstgammaclaude"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "formatter", "writer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
